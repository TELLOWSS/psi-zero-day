name: Verify G8-D SUPPORT ITEM RUNTIME VISUALS

on:
  push:
    branches:
      - sol/g8d-support-item-runtime-visuals-20260926
  pull_request:
    branches:
      - sol/g8a-audio-production-lock-20260926

permissions:
  contents: read

concurrency:
  group: g8d-support-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-g8d-support-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      - name: G8-D support runtime contracts
        run: >
          npx vitest run
          tests/g8d-support-item-runtime-visuals.test.tsx
          tests/field-support-items.test.ts
          tests/field-support-ui.test.tsx
          tests/item-story-connection-lock.test.ts
          tests/paid-item-catalog.test.ts
          tests/paid-item-wallet.test.ts

      - name: Preserve story and field-action behavior
        run: >
          npx vitest run
          tests/strategy-stage2-flow.test.tsx
          tests/episode01-final-playthrough-regression.test.ts
          tests/episode01-audio-production.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Korean QA font
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Locate Chromium
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome/Chromium not found on runner."
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Responsive regression
        shell: bash
        env:
          PSI_RESPONSIVE_ARTIFACT_DIR: artifacts/g8d-responsive
        run: |
          mkdir -p artifacts/g8d-responsive
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/g8d-preview.log 2>&1 &
          PREVIEW_PID=$!
          cleanup() { kill "$PREVIEW_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          READY=0
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              READY=1
              break
            fi
            sleep 0.25
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/g8d-preview.log
            exit 1
          fi
          node scripts/verify-episode01-responsive.mjs

      - name: Upload G8-D responsive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g8d-support-runtime-evidence
          path: artifacts/g8d-responsive
          if-no-files-found: warn
          retention-days: 14
