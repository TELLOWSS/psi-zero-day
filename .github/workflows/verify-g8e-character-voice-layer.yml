name: Verify G8-E CHARACTER VOICE LAYER

on:
  push:
    branches:
      - sol/g8e-character-voice-layer-20260926
  pull_request:
    branches:
      - sol/g8a-audio-production-lock-20260926

permissions:
  contents: read

concurrency:
  group: g8e-character-voice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-g8e-character-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      - name: G8-E voice preproduction contracts
        run: >
          npx vitest run
          tests/g8e-character-voice-layer.test.ts
          tests/episode-audio.test.ts
          tests/episode01-audio-production.test.ts
          tests/zero-breach-audio-effects.test.tsx

      - name: Episode 01 story regression
        run: >
          npx vitest run
          tests/episode01-final-playthrough-regression.test.ts
          tests/episode01-production-scene.test.ts
          tests/dialogue-art.test.ts

      - name: Export voice production sheet
        env:
          PSI_G8E_VOICE_ARTIFACT_DIR: artifacts/g8e-character-voice
        run: node scripts/export-g8e-character-voice-sheet.mjs

      - name: Verify no fake voice binaries were registered
        shell: bash
        run: |
          test ! -d public/assets/episode01/voice || test -z "$(find public/assets/episode01/voice -type f -print -quit)"
          ! grep -q '"asset_id": "ep01.voice.' content/episode01/assets.json

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload G8-E voice production sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g8e-character-voice-production-sheet
          path: artifacts/g8e-character-voice
          if-no-files-found: error
          retention-days: 14
