name: Materialize Episode 01 final backgrounds


on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: episode01-final-backgrounds
  cancel-in-progress: true

jobs:
  materialize:
    if: "!contains(github.event.head_commit.message, 'art: materialize Episode 01 final backgrounds')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - name: Decode final WebP batch from manifest
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const staging='.art-ingest/episode01';
          const manifest=JSON.parse(fs.readFileSync('content/episode01/final-art-ingest-manifest.json','utf8'));
          for (const asset of manifest.assets) {
            const prefix=asset.filename + '.b64.';
            const chunks=fs.readdirSync(staging)
              .filter(name=>name.startsWith(prefix))
              .sort();
            if (!chunks.length) throw new Error(`Missing chunks for ${asset.filename}`);
            const encoded=chunks.map(name=>fs.readFileSync(path.join(staging,name),'utf8')).join('');
            const bytes=Buffer.from(encoded,'base64');
            fs.mkdirSync(path.dirname(asset.target_path),{recursive:true});
            fs.writeFileSync(asset.target_path,bytes);
            console.log(`Decoded ${asset.filename}: ${chunks.length} chunk(s), ${bytes.length} bytes`);
          }
          fs.rmSync(staging,{recursive:true,force:true});
          NODE
      - run: npm ci
      - name: Verify exact generated final production backgrounds
        run: |
          npm run assets:final-art-ingest-check
          npm run assets:scene-background-production-check
          npm run assets:scene-background-brief-check
          npm run assets:scene-background-imagegen-check
      - name: Rebuild asset manifest
        run: npm run assets:manifest
      - name: Mark exact final-art batch as ingested
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='content/episode01/final-art-ingest-manifest.json';
          const manifest=JSON.parse(fs.readFileSync(path,'utf8'));
          manifest.status='exact_archive_verified_github_ingested';
          manifest.verification={...manifest.verification,ingested_at:new Date().toISOString()};
          fs.writeFileSync(path,JSON.stringify(manifest,null,2)+'\n');
          NODE
      - name: Run Episode 01 visual tests
        run: npm run test:episode01-visual
      - name: Commit materialized backgrounds
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/assets/episode01/cg content/episode01/assets.json content/episode01/final-art-ingest-manifest.json .art-ingest
          if git diff --cached --quiet; then
            echo "Final backgrounds already current."
          else
            git commit -m "art: materialize Episode 01 final backgrounds"
            git push
          fi
