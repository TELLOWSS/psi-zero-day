      - 'scripts/qa-omega-canonical-review.mjs'
      - 'scripts/qa-omega-silver-preview-browser.mjs'
      - 'scripts/qa-omega-silver-github-binaries-browser.mjs'
      - 'scripts/qa-omega-silver-native-watch.mjs'
      - 'scripts/qa-omega-silver-native-guard.mjs'
      - 'src/ui/OmegaSilverGuardReview.tsx'
