      - 'scripts/qa-omega-aira-e-fire-atlas.mjs'
      - 'scripts/qa-omega-aira-e-dash-atlas.mjs'
      - 'scripts/qa-omega-aira-e-hit-atlas.mjs'
      - 'scripts/qa-omega-aira-e-special-source.mjs'
      - 'src/ui/ReignitionTitle.tsx'
      - 'src/ui/reignition-title.css'
      - 'src/ui/reignition-premium.css'
      - '.github/workflows/qa-omega-protocol-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare source art files as Vite normally does
        run: npm run predev
      - name: Install test-only browser driver (no browser download)
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: Enable Korean typography for visual QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match "Noto Sans CJK KR"
      - name: Start development-only OMEGA cockpit
        env:
          VITE_OMEGA_PROTOCOL_LAB: '1'
        run: |
          npx vite --host 127.0.0.1 --port 4173 --strictPort > /tmp/omega-vite.log 2>&1 &
          echo $! > /tmp/omega-vite.pid
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/omega-vite.log
          exit 1
      - name: Real React/Canvas screenshots and viewport checks
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/qa-omega-protocol-browser.mjs
      - name: M12-G1 live industrial-depth four-size screenshots and real movement
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/qa-omega-m12g1-industrial-depth-browser.mjs
      - name: M02 genuine zombie gun / three-hit sword / facing / solid cover browser proof
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/qa-omega-gun-blade-browser.mjs
      - name: M03 four distinct zombie AI real Canvas combat and warned HP browser QA
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/qa-omega-zombie-ai-browser.mjs
      - name: M04-D6 actual native cart warning / charge and mobile-landscape boss HUD
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/qa-omega-m04d6-counterplay-browser.mjs
      - name: M04 walk through two real quarantine gates via PC keys and mobile touch
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/qa-omega-connected-gates-browser.mjs
      - name: M04-C three distinct ACT boundary 6→7 9→10 12→13 real Chrome PC and touch
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/qa-omega-three-act-boundaries-browser.mjs
      - name: Render actual AIRA eight-heading source and action contact sheet
        if: always()
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/qa-omega-actor-source-sheet.mjs
      - name: Render real mission devices across all interaction states
        if: always()
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/qa-omega-mission-source-sheet.mjs
      - name: Capture 8-way AIRA action anatomy and per-frame pixel deltas
        if: always()
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/qa-omega-aira-action-motion-sheet.mjs
      - name: Source-render AIRA V2 eight directions and real home viewports
        if: always()
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/qa-omega-aira-v2-source.mjs
      - name: Verify actual user-selected AIRA V2 8-way articulated walk imagery
        if: always()
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/qa-omega-aira-v2-walk-source.mjs
      - name: Render AIRA V2 native-shot pose and verify no false flash
        if: always()
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/qa-omega-aira-v2-fire-source.mjs
      - name: Verify actual committed E fire atlas pixel changes and source frame gating
        if: always()
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/qa-omega-aira-e-fire-atlas.mjs
      - name: Verify committed E dash illustrated source and original Watch pose integration
        if: always()
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/qa-omega-aira-e-dash-atlas.mjs
      - name: Real E-direction AIRA hit keyframe pixel and native-cue QA
        if: always()
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/qa-omega-aira-e-hit-atlas.mjs
      - name: Source-render original E ultimate and finisher art with native Watch cues
        if: always()
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/qa-omega-aira-e-special-source.mjs
      - name: Verify eight actual AIRA V2 original views across five action phases
        if: always()
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/qa-omega-aira-v2-directional-parity.mjs
      - name: Verify original E four walk paintings in actual source renderer
        if: always()
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/qa-omega-aira-e-walk-atlas.mjs
      - name: Check canonical silver AIRA and male review UI (no game deployment)
        if: always()
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/qa-omega-canonical-review.mjs
      - name: Simulate verified eight-angle local silver import into native Watch battlefield
        if: always()
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/qa-omega-silver-preview-browser.mjs
      - name: Validate REAL silver AIRA GitHub WebPs in Watch and two-game home at four responsive sizes
        if: always()
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/qa-omega-silver-github-binaries-browser.mjs
      - name: Render real nine-source AIRA and male motion-lab on PC and mobile
        if: always()
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/qa-omega-silver-real-motion-lab.mjs
      - name: Verify ORIGINAL AIRA player renders in actual SIGNAL WATCH Canvas at PC/mobile sizes
        if: always()
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/qa-omega-silver-native-watch.mjs
      - name: Verify original AIRA draws in the actual SIGNAL GUARD SVG battlefield on PC/mobile
        if: always()
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/qa-omega-silver-native-guard.mjs
      - name: Upload source-run screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-protocol-source-browser-screenshots
          path: qa-omega-protocol-captures/
          retention-days: 14
          if-no-files-found: warn
