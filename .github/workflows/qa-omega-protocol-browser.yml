      - 'src/domain/omega-protocol-blade.ts'
      - 'src/domain/omega-protocol-story.ts'
      - 'src/app/omega-protocol-access.ts'
      - 'src/domain/omega-protocol-encounter-stage.ts'
      - 'src/domain/omega-protocol-navigation.ts'
      - 'src/ui/omega-protocol-playtest.css'
