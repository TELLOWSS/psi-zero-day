name: Verify ZERO BREACH Step 4

on:
  push:
    branches:
      - sol/zero-breach-step4-balance-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  balance-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Measure unmodified ZERO BREACH balance
        run: npx vitest run tests/zero-breach-balance.test.ts

      - name: Step 1-3 focused regression
        run: npx vitest run tests/zero-breach-engine.test.ts tests/zero-breach-ui.test.tsx tests/zero-breach-save.test.ts tests/zero-breach-persistence-ui.test.tsx

      - name: Build
        run: npm run build
