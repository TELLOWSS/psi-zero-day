name: Verify G8-A PRE-ART GATE

on:
  push:
    branches:
      - sol/g8a-bottom-up-production-map-20260925

permissions:
  contents: write

concurrency:
  group: g8a-bottom-up-production-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-g8a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout G8-A branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: G8-A production-map contracts
        run: npx vitest run tests/final-art-policy.test.ts tests/korea-legal-visual-standard.test.ts tests/g8a-world-final-art.test.ts tests/g8a-swift-final-art.test.ts tests/production-map-family.test.ts tests/data-center-runtime.test.ts tests/remodel-runtime.test.ts tests/site-process-map-family.test.ts tests/site-profile-risk-priority.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Korean QA font
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Locate Chromium
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome/Chromium not found on runner."
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      - name: Run G8-A representative-slice browser QA
        shell: bash
        env:
          PSI_G8A_ARTIFACT_DIR: artifacts/g8a-bottom-up-map
        run: |
          mkdir -p artifacts/g8a-bottom-up-map
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/g8a-preview.log 2>&1 &
          PREVIEW_PID=$!
          cleanup() { kill "$PREVIEW_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          READY=0
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              READY=1
              break
            fi
            sleep 0.25
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/g8a-preview.log
            exit 1
          fi
          node scripts/verify-g8a-bottom-up-map-browser.mjs

      - name: Prepare G8-A QA evidence
        if: always()
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          mkdir -p artifacts/g8a-bottom-up-map/evidence
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          src=Path('artifacts/g8a-bottom-up-map')
          out=src/'evidence'
          out.mkdir(parents=True,exist_ok=True)
          for name in ['01-g8a-bottom-up-live.png','02-g8a-bottom-up-mobile.png','error.png']:
              p=src/name
              if not p.exists():
                  continue
              im=Image.open(p).convert('RGB')
              if im.width>1100:
                  h=round(im.height*1100/im.width)
                  im=im.resize((1100,h),Image.Resampling.LANCZOS)
              im.save(out/(p.stem+'.jpg'),'JPEG',quality=86,optimize=True)
          report=src/'g8a-bottom-up-map-report.json'
          if report.exists():
              (out/report.name).write_bytes(report.read_bytes())
          PY

      - name: Upload G8-A QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g8a-pre-art-evidence
          path: artifacts/g8a-bottom-up-map/evidence
          if-no-files-found: error
