name: TASK-014E finalize production audio

on:
  push:
    branches:
      - astra/task-007-casual-strategy-foundation
    paths:
      - 'content/episode01/audio.json'
      - 'content/episode01/session.json'
      - 'scripts/generate-episode01-audio.mjs'
      - 'scripts/build-episode01-assets.mjs'
      - 'src/ui/useEpisodeAudio.ts'
      - 'tests/episode-audio.test.ts'
      - 'package.json'
      - '.github/workflows/task-014e-finalize-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: astra/task-007-casual-strategy-foundation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Generate original deterministic Episode 01 audio
        run: npm run audio:generate

      - name: Rebuild asset manifest with audio
        run: npm run assets:manifest

      - name: Verify production assets and full release gate
        run: npm run release:production-check

      - name: Commit TASK-014E production audio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/episode01/audio/*.wav
          git add content/episode01/assets.json

          if git diff --cached --quiet; then
            echo 'No production audio changes to commit.'
            exit 0
          fi

          git commit -m 'TASK-014E: finalize production BGM and SFX'
          git push origin HEAD:astra/task-007-casual-strategy-foundation
