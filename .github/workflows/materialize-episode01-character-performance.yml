name: Materialize Episode 01 character performance

on:
  push:
    branches: [main]
    paths:
      - '.art-ingest/episode01-performance/*.b64.*'

permissions:
  contents: write

concurrency:
  group: episode01-character-performance-materialize
  cancel-in-progress: true

jobs:
  materialize:
    if: "!contains(github.event.head_commit.message, 'art: materialize Episode 01 character performance')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Decode generated performance WebP batch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/episode01/characters/performance
          expected=(
            player-resolve
            lee-jaehoon-concern
            kang-taesik-conflict
            seo-jeongmin-neutral
            lim-junho-relief
          )
          for name in "${expected[@]}"; do
            mapfile -t chunks < <(find .art-ingest/episode01-performance -maxdepth 1 -type f -name "${name}.webp.b64.*" | sort)
            test "${#chunks[@]}" -gt 0 || { echo "Missing chunks for $name"; exit 1; }
            cat "${chunks[@]}" | base64 --decode > "public/assets/episode01/characters/performance/${name}.webp"
          done
          rm -rf .art-ingest/episode01-performance

      - run: npm ci

      - name: Verify exact generated performance binaries
        run: npm run assets:character-performance-wave-status

      - name: Register verified performance wave
        run: npm run assets:character-performance-wave-ingest

      - name: Require finalized performance wave
        run: npm run assets:character-performance-wave-check

      - name: Run Episode 01 visual regression
        run: npm run test:episode01-visual

      - name: Typecheck performance runtime
        run: npm run typecheck

      - name: Commit materialized performance art
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A             public/assets/episode01/characters/performance             content/episode01/assets.json             content/episode01/character-performance-production.json             .art-ingest
          if git diff --cached --quiet; then
            echo "Character performance wave is already current."
          else
            git commit -m "art: materialize Episode 01 character performance"
            git push
          fi
