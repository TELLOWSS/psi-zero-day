name: Materialize Episode 01 character performance


on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: episode01-character-performance-materialize
  cancel-in-progress: true

jobs:
  materialize:
    if: "!contains(github.event.head_commit.message, 'art: materialize Episode 01 character performance')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Decode generated performance WebP batch from manifest
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const staging='.art-ingest/episode01-performance';
          const production=JSON.parse(fs.readFileSync('content/episode01/character-performance-production.json','utf8'));
          for (const asset of production.generated_wave_01.assets) {
            const filename=path.basename(asset.path);
            const prefix=filename + '.b64.';
            const chunks=fs.readdirSync(staging)
              .filter(name=>name.startsWith(prefix))
              .sort();
            if (!chunks.length) throw new Error(`Missing chunks for ${filename}`);
            const encoded=chunks.map(name=>fs.readFileSync(path.join(staging,name),'utf8')).join('');
            const bytes=Buffer.from(encoded,'base64');
            const target=path.join('public',asset.path);
            fs.mkdirSync(path.dirname(target),{recursive:true});
            fs.writeFileSync(target,bytes);
            console.log(`Decoded ${filename}: ${chunks.length} chunk(s), ${bytes.length} bytes`);
          }
          fs.rmSync(staging,{recursive:true,force:true});
          NODE

      - run: npm ci

      - name: Verify exact generated performance binaries
        run: npm run assets:character-performance-wave-status

      - name: Register verified performance wave
        run: npm run assets:character-performance-wave-ingest

      - name: Require finalized performance wave
        run: npm run assets:character-performance-wave-check

      - name: Run Episode 01 visual regression
        run: npm run test:episode01-visual

      - name: Typecheck performance runtime
        run: npm run typecheck

      - name: Commit materialized performance art
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A             public/assets/episode01/characters/performance             content/episode01/assets.json             content/episode01/character-performance-production.json             .art-ingest
          if git diff --cached --quiet; then
            echo "Character performance wave is already current."
          else
            git commit -m "art: materialize Episode 01 character performance"
            git push
          fi
