name: Bootstrap Android

on:
  push:
    branches:
      - astra/task-007-casual-strategy-foundation
    paths:
      - '.github/workflows/android-bootstrap.yml'
      - 'capacitor.config.ts'
      - 'scripts/configure-android.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: astra/task-007-casual-strategy-foundation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build verified web assets
        run: npm run build

      - name: Create or sync Android platform
        run: |
          if [ -d android ]; then
            npx cap sync android
            npm run android:configure
          else
            npx cap add android
            npm run android:configure
          fi

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Commit native Android project
        run: |
          if git diff --quiet -- android && [ -z "$(git ls-files --others --exclude-standard android)" ]; then
            echo "Android project already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          git commit -m "TASK-013C: generate Capacitor Android project"
          git push origin HEAD:astra/task-007-casual-strategy-foundation

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: psi-zero-day-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
