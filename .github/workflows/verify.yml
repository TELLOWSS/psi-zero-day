name: Verify vertical slice

on:
  push:
    branches:
      - main
      - astra/task-007-casual-strategy-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate deterministic Episode 01 assets
        run: |
          npm run assets:embedded
          npm run assets:vector
          npm run assets:manifest

      - name: Verify generated assets
        run: npm run assets:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Report Episode 01 production readiness
        run: npm run production:status

      - name: Upload verified web bundle
        uses: actions/upload-artifact@v4
        with:
          name: psi-zero-day-web-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
