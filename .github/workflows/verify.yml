name: Verify vertical slice

on:
  push:
    branches:
      - main
      - astra/task-007-casual-strategy-foundation
      - sol/ep01-production-map-lock-20260923
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate deterministic Episode 01 assets
        run: |
          npm run assets:embedded
          npm run assets:vector
          npm run assets:manifest

      - name: Verify generated assets
        run: npm run assets:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Korean QA font
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Locate browser for responsive QA
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome/Chromium not found on runner."
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      - name: Verify Episode 01 PC and mobile viewports
        shell: bash
        run: |
          mkdir -p artifacts/responsive
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/psi-preview.log 2>&1 &
          PREVIEW_PID=$!
          cleanup() {
            kill "$PREVIEW_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              READY=1
              break
            fi
            sleep 0.25
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/psi-preview.log
            exit 1
          fi

          node scripts/verify-episode01-responsive.mjs

      - name: Emit Production Map screenshot evidence
        if: always()
        shell: bash
        run: |
          for file in \
            artifacts/responsive/desktop-1920x1080-episode01-strategy.png \
            artifacts/responsive/phone-portrait-390x844-episode01-strategy.png
          do
            if [ -f "$file" ]; then
              echo "BEGIN_PRODUCTION_MAP_SCREENSHOT:$file"
              base64 -w0 "$file"
              echo
              echo "END_PRODUCTION_MAP_SCREENSHOT:$file"
            fi
          done

      - name: Upload responsive QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode01-responsive-qa
          path: artifacts/responsive
          if-no-files-found: warn
          retention-days: 14

      - name: Run tests
        run: npm test

      - name: Report Episode 01 production readiness
        run: npm run production:status

      - name: Upload verified web bundle
        uses: actions/upload-artifact@v4
        with:
          name: psi-zero-day-web-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
