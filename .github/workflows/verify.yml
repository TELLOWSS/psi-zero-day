name: Verify vertical slice

on:
  push:
    branches:
      - astra/task-007-casual-strategy-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate Episode 01 assets
        run: |
          npm run assets:vector
          npm run assets:manifest

      - name: Upload regenerated assets
        uses: actions/upload-artifact@v4
        with:
          name: episode01-generated-assets
          path: |
            public/assets/episode01
            content/episode01/assets.json
          if-no-files-found: error
          retention-days: 3

      - name: Verify generated assets
        run: npm run assets:check

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
