name: Build SWIFT Raster Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - sol/g8a-bottom-up-production-map-20260925
    paths:
      - 'public/assets/defense/enemies/swift-pq01.svg'
      - '.github/workflows/build-swift-raster-candidate.yml'

permissions:
  contents: write

jobs:
  rasterize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install raster tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin webp

      - name: Render legacy reference to raster candidate
        run: |
          mkdir -p public/assets/defense/enemies
          rsvg-convert             --width 1024             --height 715             public/assets/defense/enemies/swift-pq01.svg             -o /tmp/swift-raster-candidate.png
          cwebp -quiet -q 94 -alpha_q 100 -m 6             /tmp/swift-raster-candidate.png             -o public/assets/defense/enemies/swift-raster-candidate.webp
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('public/assets/defense/enemies/swift-raster-candidate.webp')
          print('SWIFT_RASTER_SIZE', im.size, im.mode)
          assert im.width >= 1024
          assert im.height >= 700
          PY

      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/defense/enemies/swift-raster-candidate.webp
          if git diff --cached --quiet; then
            echo "No SWIFT raster candidate changes."
            exit 0
          fi
          git commit -m "art: build SWIFT non-SVG raster candidate [skip ci]"
          git push origin HEAD:sol/g8a-bottom-up-production-map-20260925
