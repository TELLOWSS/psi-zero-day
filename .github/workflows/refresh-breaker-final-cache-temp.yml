name: Recalculate offline release for portrait AUTO control
on:
  push:
    branches: [art/story-cinema-20261017]
    paths: ['.github/workflows/refresh-breaker-final-cache-temp.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: '24.x'}
      - name: Verify syntax and refresh exact offline asset hashes
        run: |
          node --check public/signal-breaker-dev/src/combat-vfx.js
          node scripts/check-signal-breaker-release.mjs --write
          node scripts/check-signal-breaker-release.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/signal-breaker-dev/release.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(breaker): sync cached portrait HUD and raid impact graphics"
          git push origin HEAD:art/story-cinema-20261017
