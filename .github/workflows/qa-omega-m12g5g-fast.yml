name: M12-G5g quick live Canvas native-pose acceptance

on:
  pull_request:
    paths:
      - 'src/ui/omega-protocol-m12g5g-native-pose.ts'
      - 'src/ui/omega-protocol-m12g5c-local-art-review.ts'
      - 'src/ui/omega-aira-v2-candidate.ts'
      - 'src/ui/omega-protocol-playtest.css'
      - 'src/ui/OmegaProtocolPlaytest.tsx'
      - 'scripts/qa-omega-m12g5g-native-pose-browser.mjs'
      - '.github/workflows/qa-omega-m12g5g-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-pose-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare Vite development assets
        run: npm run predev
      - name: Install test-only driver without browser download
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: Launch dev-only game scene
        env:
          VITE_OMEGA_PROTOCOL_LAB: '1'
        run: |
          npx vite --host 127.0.0.1 --port 4173 --strictPort >/tmp/omega-m12g5g-vite.log 2>&1 &
          for attempt in $(seq 1 65); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/omega-m12g5g-vite.log
          exit 1
      - name: Four real browser sizes native native-pose render pixel probes
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/qa-omega-m12g5g-native-pose-browser.mjs
      - name: Upload four-size native scene proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-m12g5g-focused-chrome
          path: |
            qa-omega-protocol-captures/m12g5g-*
          retention-days: 14
          if-no-files-found: warn
