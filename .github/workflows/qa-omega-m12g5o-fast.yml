name: M12-G5o authentic East combat and diagonal scene art browser QA

on:
  pull_request:
    paths:
      - 'src/ui/omega-scene-art-preview.ts'
      - 'src/ui/omega-scene-art-preview-metadata.json'
      - 'public/assets/omega/scene-art-preview/**'
      - 'qa-art/m12g5o/**'
      - 'tests/omega-scene-east-native-originals.test.ts'
      - 'tests/omega-scene-art-preview.test.ts'
      - 'src/ui/omega-protocol-m12g5c-local-art-review.ts'
      - 'src/ui/omega-aira-v2-candidate.ts'
      - 'src/ui/omega-protocol-playtest.css'
      - 'src/ui/OmegaProtocolPlaytest.tsx'
      - 'scripts/qa-omega-m12g5o-east-diagonal-browser.mjs'
      - '.github/workflows/qa-omega-m12g5o-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authentic-east-diagonal-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare Vite development assets
        run: npm run predev
      - name: Install test-only driver without browser download
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: Launch dev-only game scene
        env:
          VITE_OMEGA_PROTOCOL_LAB: '1'
        run: |
          npx vite --host 127.0.0.1 --port 4173 --strictPort >/tmp/omega-m12g5o-vite.log 2>&1 &
          for attempt in $(seq 1 65); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/omega-m12g5o-vite.log
          exit 1
      - name: Korean interface glyphs for authentic four-size capture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
          fc-cache -f
      - name: Four actual browser sizes East action + diagonal native Canvas source proof
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/qa-omega-m12g5o-east-diagonal-browser.mjs
      - name: Upload four-size native scene proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-m12g5o-east-diagonal-real-chrome
          path: |
            qa-omega-protocol-captures/m12g5o-*
          retention-days: 14
          if-no-files-found: warn
