name: Signal Breaker causal flow
on:
  push:
    branches: [main, codex/signal-break-causal-redesign-20261011]
    paths:
      - public/signal-breaker-dev/**
      - .github/workflows/verify-signal-breaker-causal.yml
  pull_request:
    paths:
      - public/signal-breaker-dev/**
      - .github/workflows/verify-signal-breaker-causal.yml
permissions:
  contents: read
jobs:
  source-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install existing test dependencies
        run: npm ci --ignore-scripts
      - name: Mode rules and regression
        run: |
          node scripts/check-signal-breaker-release.mjs
          node --test public/signal-breaker-dev/tests/*.cjs
      - name: Reproduce all 80 simulated input runs
        run: |
          node public/signal-breaker-dev/scripts/simulate-flow.cjs /tmp/psi-flow-simulation.json
          node -e "require('node:assert/strict').deepEqual(require('/tmp/psi-flow-simulation.json'),require('./docs/qa/breaker-regression-20261018/flow.json'))"
      - name: Reproduce all 80 hazard cascade input runs
        run: |
          node public/signal-breaker-dev/scripts/simulate-burst.cjs /tmp/psi-burst-simulation.json
          node -e "require('node:assert/strict').deepEqual(require('/tmp/psi-burst-simulation.json'),require('./docs/qa/breaker-regression-20261018/burst.json'))"
      - name: Reproduce three one-hour continuous input sessions
        run: |
          node public/signal-breaker-dev/scripts/simulate-continuous.cjs /tmp/psi-continuous-simulation.json
          node -e "require('node:assert/strict').deepEqual(require('/tmp/psi-continuous-simulation.json'),require('./docs/qa/breaker-regression-20261018/continuous.json'))"
      - name: Reproduce player-led operation and boss input sessions
        run: |
          node public/signal-breaker-dev/scripts/simulate-operations.cjs /tmp/psi-operation-simulation.json
          node -e "require('node:assert/strict').deepEqual(require('/tmp/psi-operation-simulation.json'),require('./docs/qa/breaker-regression-20261018/operations.json'))"
      - name: Reproduce movement-guidance input sessions
        run: |
          node public/signal-breaker-dev/scripts/simulate-assist-guidance.cjs /tmp/psi-assist-simulation.json
          node -e "require('node:assert/strict').deepEqual(require('/tmp/psi-assist-simulation.json'),require('./docs/qa/breaker-regression-20261018/assist-guidance.json'))"
      - name: Reproduce veteran affinity and evolution inputs
        run: |
          node public/signal-breaker-dev/scripts/simulate-veteran.cjs /tmp/veteran-simulation.json
          node -e "require('node:assert/strict').deepEqual(require('/tmp/veteran-simulation.json'),require('./docs/qa/breaker-regression-20261018/veteran.json'))"
      - name: Prepare browser verification
        run: |
          npm install --prefix "$RUNNER_TEMP/signal-breaker-browser" --no-package-lock playwright@1.58.2
          "$RUNNER_TEMP/signal-breaker-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Phone portrait, phone landscape, tablet and PC
        env:
          SIGNAL_BREAKER_PLAYWRIGHT_ROOT: ${{ runner.temp }}/signal-breaker-browser
          SIGNAL_BREAKER_QA_OUTPUT: ${{ runner.temp }}/causal-qa
        run: |
          failures=0
          for script in verify-psi-rpg-art verify-weapon-tree verify-ep02-workshop verify-evolution-repairs verify-veteran-offline verify-ui-release verify-boss-articulation verify-causal-source verify-stage-ending verify-campaign-ending verify-ending-sound verify-ending-voice verify-ending-voice-ingest; do
            echo "::group::$script"
            node "public/signal-breaker-dev/scripts/$script.cjs" || failures=$((failures + 1))
            echo "::endgroup::"
          done
          if [ "$failures" -ne 0 ]; then echo "::error::$failures Signal Breaker browser checks failed"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-breaker-causal-browser
          path: ${{ runner.temp }}/causal-qa
