name: Generate Capacitor lockfile

on:
  push:
    branches:
      - astra/task-007-casual-strategy-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: astra/task-007-casual-strategy-foundation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Resolve Capacitor 8.5.2
        run: |
          npm install --package-lock-only --save-exact @capacitor/core@8.5.2 @capacitor/android@8.5.2
          npm install --package-lock-only --save-dev --save-exact @capacitor/cli@8.5.2

      - name: Commit resolved package metadata
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Capacitor package metadata already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "TASK-013C: resolve Capacitor 8.5.2 dependencies"
          git push origin HEAD:astra/task-007-casual-strategy-foundation
