name: Build Android Release Bundle

on:
  push:
    branches:
      - astra/task-007-casual-strategy-foundation
    paths:
      - '.github/workflows/android-release.yml'
      - 'android/app/build.gradle'
      - 'capacitor.config.ts'
      - 'scripts/configure-android.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build verified web assets
        run: npm run build

      - name: Sync Android platform
        run: |
          npx cap sync android
          npm run android:configure

      - name: Prepare optional release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/psi-zero-day-release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/psi-zero-day-release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_RELEASE_SIGNED=true" >> "$GITHUB_ENV"
            echo "Release keystore loaded from GitHub Secrets."
          else
            echo "ANDROID_RELEASE_SIGNED=false" >> "$GITHUB_ENV"
            echo "No release keystore secret present; building an unsigned release AAB for packaging verification."
          fi

      - name: Build release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Verify release bundle output
        run: |
          test -f android/app/build/outputs/bundle/release/app-release.aab
          ls -lh android/app/build/outputs/bundle/release/app-release.aab
          {
            echo "PSI : ZERO DAY Android release bundle"
            echo "commit=${GITHUB_SHA}"
            echo "signed=${ANDROID_RELEASE_SIGNED}"
            echo "applicationId=com.tellowss.psizeroday"
            echo "versionCode=1"
            echo "versionName=1.0"
          } > android-release-info.txt

      - name: Verify AAB signature when signing is enabled
        if: env.ANDROID_RELEASE_SIGNED == 'true'
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: psi-zero-day-release-aab
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android-release-info.txt
          if-no-files-found: error
          retention-days: 14
