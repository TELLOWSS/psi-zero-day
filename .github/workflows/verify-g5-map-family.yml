name: Verify G5 MAP-FAMILY-01

on:
  push:
    branches:
      - sol/g5-map-family-01-20260925

permissions:
  contents: read

concurrency:
  group: g5-map-family-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-g5:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout G5 branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: G5 map-family contracts
        run: npx vitest run tests/site-process-map-family.test.ts tests/site-profile-risk-priority.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
