name: Verify Guard Watch Endgame Balance

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/engine/guard-mastery.ts'
      - 'src/engine/defense.ts'
      - 'src/engine/survivors-difficulty.ts'
      - 'src/engine/survivors-mastery-focus.ts'
      - 'src/app/defense-save.ts'
      - 'tests/guard-mastery-endgame.test.ts'
      - 'tests/watch-mastery-endgame.test.ts'
      - 'tests/guard-watch-endgame-balance-audit.test.ts'
      - '.github/workflows/verify-endgame-balance.yml'
permissions:
  contents: read
concurrency:
  group: endgame-balance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  endgame-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Guard six scenarios, Watch fifty stage risk focus, gear stress simulations
        run: npx vitest run tests/guard-mastery-endgame.test.ts tests/watch-mastery-endgame.test.ts tests/guard-watch-endgame-balance-audit.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
