name: Verify G4 SITE-PROFILE-01

on:
  push:
    branches:
      - sol/g4-site-profile-01-20260925

permissions:
  contents: read

concurrency:
  group: g4-site-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-g4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout G4 branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: G4 site profile contracts
        run: npx vitest run tests/site-profile-risk-priority.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
