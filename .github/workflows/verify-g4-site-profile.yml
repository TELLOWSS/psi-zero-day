name: Verify G4 SITE-PROFILE-01

on:
  push:
    branches:
      - sol/g4-site-profile-01-20260925

permissions:
  contents: write

concurrency:
  group: g4-site-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-g4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout G4 branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: G4 site profile contracts
        run: npx vitest run tests/site-profile-risk-priority.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Korean QA font
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Locate Chromium
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome/Chromium not found on runner."
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      - name: Run G4 site profile browser QA
        shell: bash
        env:
          PSI_G4_ARTIFACT_DIR: artifacts/g4-site-profile
        run: |
          mkdir -p artifacts/g4-site-profile
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/g4-preview.log 2>&1 &
          PREVIEW_PID=$!
          cleanup() { kill "$PREVIEW_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          READY=0
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              READY=1
              break
            fi
            sleep 0.25
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/g4-preview.log
            exit 1
          fi
          node scripts/verify-g4-site-profile-browser.mjs

      - name: Persist G4 QA evidence
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          rm -rf qa/g4-site-profile
          mkdir -p qa/g4-site-profile
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          src=Path('artifacts/g4-site-profile')
          out=Path('qa/g4-site-profile')
          for name in ['desktop-site-profile.png','mobile-site-profile.png','error.png']:
              p=src/name
              if not p.exists():
                  continue
              im=Image.open(p).convert('RGB')
              if im.width>1100:
                  h=round(im.height*1100/im.width)
                  im=im.resize((1100,h),Image.Resampling.LANCZOS)
              im.save(out/(p.stem+'.jpg'),'JPEG',quality=84,optimize=True)
          report=src/'g4-site-profile-report.json'
          if report.exists():
              (out/report.name).write_bytes(report.read_bytes())
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A qa/g4-site-profile
          if git diff --cached --quiet; then
            echo "No G4 evidence changes."
            exit 0
          fi
          git commit -m "qa: store G4 site profile evidence [skip ci]"
          git push origin HEAD:sol/g4-site-profile-01-20260925
