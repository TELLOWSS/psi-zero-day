name: Refresh Signal Breaker offline manifest after graphics pass
on:
  push:
    branches: [art/story-cinema-20261017]
    paths: ['.github/workflows/refresh-breaker-release-graphics-temp.yml']
permissions:
  contents: write
jobs:
  update:
    if: github.ref == 'refs/heads/art/story-cinema-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Verify cinematic VFX, refresh bytes, and commit only the JSON snapshot
        run: |
          node --check public/signal-breaker-dev/src/combat-vfx.js
          node scripts/check-signal-breaker-release.mjs --write
          node scripts/check-signal-breaker-release.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/signal-breaker-dev/release.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(breaker): update offline manifest for layered boss contact VFX"
          git push origin HEAD:art/story-cinema-20261017
