name: Verify DEF-GAMEPLAY-IDENTITY-01

on:
  push:
    branches:
      - sol/defense-gameplay-identity-control-cycle-20260928
    paths:
      - 'src/ui/DefCoreOneStep.tsx'
      - 'src/ui/DefenseGame.tsx'
      - 'content/defense/def-core-01.json'
      - 'tests/def-core-gameplay-identity.test.ts'
      - 'tests/g8a-v05-cinematic.test.ts'
      - 'scripts/verify-defense-gameplay-identity-browser.mjs'
      - '.github/workflows/verify-defense-gameplay-identity.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/ui/DefCoreOneStep.tsx'
      - 'src/ui/DefenseGame.tsx'
      - 'content/defense/def-core-01.json'
      - 'tests/def-core-gameplay-identity.test.ts'
      - 'tests/g8a-v05-cinematic.test.ts'
      - 'scripts/verify-defense-gameplay-identity-browser.mjs'
      - '.github/workflows/verify-defense-gameplay-identity.yml'

permissions:
  contents: read

concurrency:
  group: def-gameplay-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-control-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: CONTROL gameplay identity contracts
        run: npx vitest run tests/def-core-gameplay-identity.test.ts tests/g8a-v05-cinematic.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Korean QA font
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Locate Chromium
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome/Chromium not found on runner."
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      - name: Run A B C browser gameplay gate
        shell: bash
        env:
          PSI_GAMEPLAY_IDENTITY_ARTIFACT_DIR: artifacts/def-gameplay-identity
        run: |
          mkdir -p artifacts/def-gameplay-identity
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/def-gameplay-identity-preview.log 2>&1 &
          PREVIEW_PID=$!
          cleanup() { kill "$PREVIEW_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          READY=0
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              READY=1
              break
            fi
            sleep 0.25
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/def-gameplay-identity-preview.log
            exit 1
          fi
          node scripts/verify-defense-gameplay-identity-browser.mjs

      - name: Upload gameplay identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: def-gameplay-identity-01-evidence
          path: artifacts/def-gameplay-identity
          if-no-files-found: error
