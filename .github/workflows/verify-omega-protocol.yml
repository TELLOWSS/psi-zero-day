name: Verify OMEGA PROTOCOL roguelite core

on:
  pull_request:
    paths:
      - 'src/domain/omega-protocol-run.ts'
      - 'src/domain/omega-protocol-field.ts'
      - 'src/domain/omega-protocol-navigation.ts'
      - 'tests/omega-protocol-navigation.test.ts'
      - 'tests/omega-protocol-live-traversal.test.ts'
      - 'src/ui/omega-protocol-field-render.ts'
      - 'src/ui/omega-protocol-camera.ts'
      - 'tests/omega-protocol-camera.test.ts'
      - 'tests/omega-protocol-field.test.ts'
      - 'src/engine/omega-protocol-combat.ts'
      - 'src/engine/omega-protocol-boss-pattern.ts'
      - 'tests/omega-protocol-boss-pattern.test.ts'
      - 'src/ui/omega-protocol-enemy-render.ts'
      - 'src/ui/OmegaProtocolPlaytest.tsx'
      - 'src/ui/omega-protocol-playtest.css'
      - 'src/ui/omega-protocol-actor-render.ts'
      - 'src/ui/omega-protocol-grounded-gait.ts'
      - 'tests/omega-protocol-grounded-gait.test.ts'
      - 'src/ui/omega-protocol-actor-cues.ts'
      - 'src/ui/omega-protocol-impact-vfx.ts'
      - 'src/ui/omega-protocol-art-slot.ts'
      - 'src/ui/omega-protocol-motion-qa-gate.ts'
      - 'tests/omega-protocol-motion-qa-gate.test.ts'
      - 'tests/omega-protocol-art-slot.test.ts'
      - 'tests/omega-protocol-impact-vfx.test.ts'
      - 'tests/omega-protocol-actor-cues.test.ts'
      - 'tests/omega-protocol-boss-visuals.test.ts'
      - 'tests/omega-protocol-actor-render.test.ts'
      - 'src/engine/patrol-survivors-engine.ts'
      - 'tests/omega-protocol-combat.test.ts'
      - 'tests/omega-protocol-performance.test.ts'
      - 'tests/omega-protocol-run.test.ts'
      - '.github/workflows/verify-omega-protocol.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Run deterministic roguelite contract
        run: npx vitest run tests/omega-protocol-run.test.ts tests/omega-protocol-combat.test.ts tests/omega-protocol-performance.test.ts tests/omega-protocol-field.test.ts tests/omega-protocol-navigation.test.ts tests/omega-protocol-live-traversal.test.ts tests/omega-protocol-camera.test.ts tests/omega-protocol-boss-pattern.test.ts tests/omega-protocol-boss-visuals.test.ts tests/omega-protocol-actor-render.test.ts tests/omega-protocol-grounded-gait.test.ts tests/omega-protocol-actor-cues.test.ts tests/omega-protocol-impact-vfx.test.ts tests/omega-protocol-art-slot.test.ts tests/omega-protocol-motion-qa-gate.test.ts --maxConcurrency=1
