name: Verify G7 DATA-CENTER-01

on:
  push:
    branches:
      - sol/g7-data-center-01-20260925

permissions:
  contents: read

concurrency:
  group: g7-data-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-g7:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout G7 branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: G7 data-center contracts
        run: npx vitest run tests/data-center-runtime.test.ts tests/remodel-runtime.test.ts tests/site-process-map-family.test.ts tests/site-profile-risk-priority.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
