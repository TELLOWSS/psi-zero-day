name: Verify G8-A PREMIUM AUDIO PREPRODUCTION

on:
  push:
    branches:
      - sol/g8a-audio-production-lock-20260926

permissions:
  contents: read

concurrency:
  group: g8a-premium-audio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-g8a-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audio branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Premium audio manifest status
        run: npm run defense:g8a-premium-audio-status

      - name: Premium audio contracts and defense audio regression
        run: npm run test:g8a-premium-audio

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
