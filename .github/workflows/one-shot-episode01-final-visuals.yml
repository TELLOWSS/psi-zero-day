name: One-shot Episode 01 final visuals

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-episode01-final-visuals.yml'

permissions:
  contents: write

concurrency:
  group: episode01-one-shot-final-visuals
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Download exact contracted archives
        env:
          BG_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-7700-8206-ac61-c4753a3a2578/raw?se=2026-09-20T06%3A33%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=06846db7-8df4-5715-bc61-cd250fbefe4d&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T01%3A15%3A24Z&ske=2026-09-21T01%3A15%3A24Z&sks=b&skv=2026-02-06&sig=lj3prHk94F1yOEUk6L3jZer8/Y0VLfM4oacUnN78CDQ%3D'
          PF_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-5120-8206-ac6a-da88e1af44c0/raw?se=2026-09-20T06%3A33%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=178ffd83-05f6-53ba-8aad-dd65e947c9da&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T00%3A19%3A02Z&ske=2026-09-21T00%3A19%3A02Z&sks=b&skv=2026-02-06&sig=y1wG0XrNdU7rRazNqTbC4lPN0XmtKJEnNr1xKFAvm1g%3D'
        run: |
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 120 "$BG_URL" -o /tmp/bg.zip
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 120 "$PF_URL" -o /tmp/pf.zip

      - name: Verify archives and extract contracted binaries
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          root=pathlib.Path('.').resolve()

          bgm=json.loads((root/'content/episode01/final-art-ingest-manifest.json').read_text())
          bgraw=pathlib.Path('/tmp/bg.zip').read_bytes()
          assert len(bgraw)==bgm['archive']['bytes'], (len(bgraw),bgm['archive']['bytes'])
          assert hashlib.sha256(bgraw).hexdigest()==bgm['archive']['sha256']
          with zipfile.ZipFile('/tmp/bg.zip') as z:
              names=set(z.namelist())
              for asset in bgm['assets']:
                  name=asset['filename']
                  assert name in names, name
                  raw=z.read(name)
                  assert len(raw)==asset['bytes'], name
                  assert hashlib.sha256(raw).hexdigest()==asset['sha256'], name
                  target=root/asset['target_path']
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(raw)

          prod=json.loads((root/'content/episode01/character-performance-production.json').read_text())
          wave=prod['generated_wave_01']
          pfraw=pathlib.Path('/tmp/pf.zip').read_bytes()
          assert len(pfraw)==wave['archive']['bytes'], (len(pfraw),wave['archive']['bytes'])
          assert hashlib.sha256(pfraw).hexdigest()==wave['archive']['sha256']
          with zipfile.ZipFile('/tmp/pf.zip') as z:
              names=z.namelist()
              for asset in wave['assets']:
                  suffix='/public/'+asset['path']
                  matches=[n for n in names if ('/'+n).endswith(suffix)]
                  assert len(matches)==1, (asset['path'],matches)
                  raw=z.read(matches[0])
                  assert len(raw)==asset['bytes'], asset['path']
                  assert hashlib.sha256(raw).hexdigest()==asset['sha256'], asset['path']
                  target=root/'public'/asset['path']
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(raw)

          print('Verified and extracted 8 final backgrounds + 5 performance WebPs.')
          PY

      - run: npm ci

      - name: Verify final backgrounds
        run: |
          npm run assets:final-art-ingest-check
          npm run assets:scene-background-production-check
          npm run assets:scene-background-brief-check
          npm run assets:scene-background-imagegen-check

      - name: Rebuild background-aware asset manifest
        run: npm run assets:manifest

      - name: Verify and register character performance wave
        run: |
          npm run assets:character-performance-wave-status
          npm run assets:character-performance-wave-ingest
          npm run assets:character-performance-wave-check

      - name: Mark final background ingest complete
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='content/episode01/final-art-ingest-manifest.json';
          const m=JSON.parse(fs.readFileSync(p,'utf8'));
          m.status='exact_archive_verified_github_ingested';
          m.verification={...m.verification,ingested_at:new Date().toISOString()};
          fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n');
          NODE

      - name: Final Episode 01 validation
        run: |
          npm run test:episode01-visual
          npm run typecheck
          npm run production:status

      - name: Commit final visual binaries and remove one-shot workflow
        run: |
          rm -f .github/workflows/one-shot-episode01-final-visuals.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            public/assets/episode01/cg \
            public/assets/episode01/characters/performance \
            content/episode01/assets.json \
            content/episode01/final-art-ingest-manifest.json \
            content/episode01/character-performance-production.json \
            .github/workflows/one-shot-episode01-final-visuals.yml
          git commit -m "art: ingest Episode 01 final visual production"
          git push origin HEAD:main
