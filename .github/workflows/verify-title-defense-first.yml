name: Verify TITLE-DEFENSE-FIRST-01

on:
  push:
    branches:
      - sol/title-defense-first-v2-20260925
  pull_request:
    branches:
      - sol/def-core-01-one-step-20260925

permissions:
  contents: read

concurrency:
  group: title-defense-first-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-title:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout title branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify defense-first title contract
        shell: bash
        run: |
          grep -q "현장 디펜스 시작" src/ui/GameHub.tsx
          grep -q "사고 전 신호를 읽고, 현장을 바꿔라." src/ui/GameHub.tsx
          grep -q "LIVE SITE" src/ui/GameHub.tsx
          grep -q "현장 · 공정" src/ui/GameHub.tsx
          grep -q "is-defense-entry" src/ui/game-hub.css
