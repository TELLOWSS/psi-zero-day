name: Verify TITLE-DEFENSE-FIRST-01

on:
  push:
    branches:
      - sol/commercial-presentation-upgrade-20260927
    paths:
      - 'src/ui/GameHub.tsx'
      - 'src/ui/game-hub.css'
      - 'content/episode01/main-title-layout.json'
      - 'scripts/verify-title-defense-first.mjs'
      - 'tests/main-title-layout.test.ts'
      - 'tests/commercial-presentation-upgrade.test.ts'
      - '.github/workflows/verify-title-defense-first.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/ui/GameHub.tsx'
      - 'src/ui/game-hub.css'
      - 'content/episode01/main-title-layout.json'
      - 'tests/main-title-layout.test.ts'
      - 'tests/commercial-presentation-upgrade.test.ts'
      - 'scripts/verify-title-defense-first.mjs'
      - '.github/workflows/verify-title-defense-first.yml'

permissions:
  contents: read

concurrency:
  group: title-defense-first-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-title:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Commercial presentation contracts
        run: npx vitest run tests/main-title-layout.test.ts tests/commercial-presentation-upgrade.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify defense-first title contract
        shell: bash
        run: |
          grep -q "MODE_SELECT_V11" src/ui/GameHub.tsx
          grep -q "setModePreview('defense')" src/ui/GameHub.tsx
          grep -q "사고 전 신호를 읽고, 현장을 바꿔라." src/ui/GameHub.tsx
          grep -q "LIVE SITE" src/ui/GameHub.tsx
          grep -q "MODE_SELECT_V11" src/ui/shooting-entry.css

      - name: Install Korean QA font
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Locate Chromium
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome/Chromium not found on runner."
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      - name: Run title browser QA
        shell: bash
        env:
          PSI_TITLE_ARTIFACT_DIR: artifacts/title-defense-first
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: /tmp/psi-title-browser/node_modules
          PSI_PREVIEW_URL: http://127.0.0.1:4173
        run: |
          mkdir -p artifacts/title-defense-first
          npm install --prefix /tmp/psi-title-browser --no-save --package-lock=false playwright@1.62.1
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/title-preview.log 2>&1 &
          PREVIEW_PID=$!
          cleanup() { kill "$PREVIEW_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          READY=0
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              READY=1
              break
            fi
            sleep 0.25
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/title-preview.log
            exit 1
          fi
          node scripts/verify-survivors-mode-previews.mjs

      - name: Upload title QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: title-defense-first-physical-phone-v10
          path: artifacts/title-defense-first
          if-no-files-found: error
