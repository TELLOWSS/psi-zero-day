name: Verify DEF-HD01 Master World Layout

on:
  push:
    branches:
      - sol/def-hd01-master-world-20260924
    paths-ignore:
      - 'qa/def-hd01-preview/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: def-hd01-master-world-layout
  cancel-in-progress: true

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: DEF-HD00 + DEF-HD01 contracts
        run: >
          npx vitest run
          tests/def-hd00-defense-baseline-contract.test.ts
          tests/def-hd01-world-layout-contract.test.ts
          tests/def-hd01-hd-board-runtime.test.ts
          tests/zero-breach-production-art-baseline.test.tsx
          tests/zero-breach-engine.test.ts
          tests/zero-breach-save.test.ts
          tests/zero-breach-event.test.ts

      - name: Build
        run: npm run build

      - name: Install Korean QA font
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Locate Chromium
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome/Chromium not found on runner."
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      - name: Run DefenseGame HD master-world browser QA
        shell: bash
        env:
          PSI_DEF_HD01_EXPECT_HD_BOARD: '1'
          PSI_DEFENSE_STEP4_ARTIFACT_DIR: artifacts/def-hd01-browser
        run: |
          mkdir -p artifacts/def-hd01-browser
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/def-hd01-preview.log 2>&1 &
          PREVIEW_PID=$!
          cleanup() { kill "$PREVIEW_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          READY=0
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              READY=1
              break
            fi
            sleep 0.25
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/def-hd01-preview.log
            exit 1
          fi

          node scripts/verify-zero-breach-step4-browser.mjs

      - name: Persist compact DEF-HD01 visual evidence
        if: always()
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          rm -rf qa/def-hd01-preview
          mkdir -p qa/def-hd01-preview
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json, base64

          src = Path('artifacts/def-hd01-browser')
          out = Path('qa/def-hd01-preview')
          wanted = ['01-tutorial-place.png','02-tutorial-start.png','06-wave10-running.png','07-result.png','error.png']

          for name in wanted:
              p = src / name
              if not p.exists():
                  continue
              im = Image.open(p).convert('RGB')
              if im.width > 900:
                  h = round(im.height * 900 / im.width)
                  im = im.resize((900,h), Image.Resampling.LANCZOS)
              jpg = out / (p.stem + '.jpg')
              im.save(jpg,'JPEG',quality=76,optimize=True)
              (out / (jpg.name + '.b64')).write_text(base64.b64encode(jpg.read_bytes()).decode('ascii'))

          report = src / 'step4-browser-report.json'
          if report.exists():
              (out / report.name).write_bytes(report.read_bytes())
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A qa/def-hd01-preview
          if git diff --cached --quiet; then
            echo "No DEF-HD01 QA evidence to commit."
            exit 0
          fi
          git commit -m "qa: store DEF-HD01 runtime visual evidence [skip ci]"
          git push origin HEAD:"$GITHUB_REF_NAME"
