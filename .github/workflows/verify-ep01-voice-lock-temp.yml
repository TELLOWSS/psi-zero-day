name: Verify EP01 Voice Lock

on:
  push:
    branches:
      - feature/ep01-voice-integration-lock
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-voice-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize and verify four voice masters
        run: |
          npm run audio:voice-materialize
          npm run audio:production-check

      - name: Voice production contracts
        run: |
          npx vitest run \
            tests/episode01-voice-integration.test.ts \
            tests/episode01-voice-runtime-lock.test.ts \
            tests/episode01-audio-production.test.ts

      - name: Generate deterministic Episode 01 assets
        run: |
          npm run assets:embedded
          npm run assets:vector
          npm run assets:manifest

      - name: Verify generated assets
        run: npm run assets:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Korean QA font
        shell: bash
        run: |
          FONT_DIR="$HOME/.local/share/fonts/psi-qa"
          mkdir -p "$FONT_DIR"
          cp public/fonts/BlackHanSans-Regular.ttf "$FONT_DIR/"
          cp public/fonts/BlackHanSans-OFL.txt "$FONT_DIR/"
          fc-cache -f "$FONT_DIR"
          fc-query --format '%{family}\n' "$FONT_DIR/BlackHanSans-Regular.ttf" | grep -F 'Black Han Sans'
          fc-match --format '%{file}\n' 'Black Han Sans:charset=d55c' | grep -Fx "$FONT_DIR/BlackHanSans-Regular.ttf"

      - name: Locate browser for responsive QA
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome/Chromium not found on runner."
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      - name: Verify Episode 01 desktop and 390x844 presentation
        shell: bash
        run: |
          mkdir -p artifacts/responsive
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/psi-preview.log 2>&1 &
          PREVIEW_PID=$!
          cleanup() { kill "$PREVIEW_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          READY=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              READY=1
              break
            fi
            sleep 0.25
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/psi-preview.log
            exit 1
          fi
          node scripts/verify-episode01-responsive.mjs

      - name: Verify Survivors mobile touch and tablet layout
        shell: bash
        run: |
          npx vite --host 127.0.0.1 --port 4174 > /tmp/psi-mobile-vite.log 2>&1 &
          MOBILE_VITE_PID=$!
          trap 'kill "$MOBILE_VITE_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 0.25
          done
          PSI_PREVIEW_URL=http://127.0.0.1:4174 node scripts/verify-survivors-mobile.mjs

      - name: Upload Survivors mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: survivors-mobile-qa
          path: artifacts/survivors-mobile
          if-no-files-found: warn
          retention-days: 7

      - name: Run full regression suite
        run: npm test

      - name: Report Episode 01 production readiness
        run: npm run production:status


