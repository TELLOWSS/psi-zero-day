name: HD-02 mobile camera visual QA

on:
  push:
    branches:
      - sol/hd02-mobile-camera-20260924
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hd02-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build current HD-02 commit
        run: npm run build

      - name: Locate Chromium
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome/Chromium not found on runner."
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      - name: Run exact HD-02 viewport QA
        shell: bash
        env:
          PSI_RESPONSIVE_PROFILE: hd02
          PSI_RESPONSIVE_ARTIFACT_DIR: artifacts/hd02-responsive
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/psi-hd02-preview.log 2>&1 &
          PREVIEW_PID=$!
          cleanup() {
            kill "$PREVIEW_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for attempt in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              READY=1
              break
            fi
            sleep 0.25
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/psi-hd02-preview.log
            exit 1
          fi

          node scripts/verify-episode01-responsive.mjs

      - name: Upload HD-02 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hd02-mobile-camera-visual-qa
          path: artifacts/hd02-responsive
          if-no-files-found: error
          retention-days: 14
