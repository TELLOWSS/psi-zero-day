name: Verify Signal Watch 50-stage graphics
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ui/PatrolSurvivorsGame.tsx'
      - 'src/ui/survivors-stage-light.ts'
      - 'src/ui/survivors-workface-depth.ts'
      - 'src/ui/survivors-projectile-feedback.ts'
      - 'src/ui/survivors-scene-lighting.ts'
      - 'src/ui/survivors-directional-art.ts'
      - 'src/ui/survivors-stage-art.ts'
      - 'public/assets/survivors/**'
      - 'tests/survivors-stage-light.test.ts'
      - 'tests/survivors-workface-depth.test.ts'
      - 'tests/verify-survivors-stage50-visual.mjs'
      - '.github/workflows/verify-signal-watch-stage50.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm test && npm run typecheck && npm run build
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        viewport: ['1440x900', '390x844', '844x390', '1024x768']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm install --prefix /tmp/psi-browser-tools --no-save --package-lock=false playwright@1.62.1
      - name: All 50 workfaces, reduced motion and low quality
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: /tmp/psi-browser-tools/node_modules
          PSI_PREVIEW_URL: http://127.0.0.1:4174
          PSI_VIEWPORT: ${{ matrix.viewport }}
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          npm run dev -- --host 127.0.0.1 --port 4174 > /tmp/watch50-dev.log 2>&1 &
          WATCH50_PID=$!
          trap 'kill "$WATCH50_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 0.25
          done
          node tests/verify-survivors-stage50-visual.mjs
          PSI_LOW=1 node tests/verify-survivors-stage50-visual.mjs
          if [[ "$PSI_VIEWPORT" == '390x844' || "$PSI_VIEWPORT" == '844x390' ]]; then
            PSI_CROWD=1 node tests/verify-survivors-stage50-visual.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch50-${{ matrix.viewport }}
          path: artifacts/signal-watch-stage50
