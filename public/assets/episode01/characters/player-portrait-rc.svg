<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9f1fb"/><stop offset=".55" stop-color="#bcdfee"/><stop offset="1" stop-color="#8fbfd5"/></linearGradient>
  <radialGradient id="halo" cx="48%" cy="37%" r="58%"><stop stop-color="#ffffff" stop-opacity=".95"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
  <linearGradient id="vest" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#54b8df"/><stop offset=".55" stop-color="#2f8fbd"/><stop offset="1" stop-color="#1d5b87"/></linearGradient>
  <linearGradient id="helmet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".6" stop-color="#e8f1f4"/><stop offset="1" stop-color="#c5d3d8"/></linearGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0c2a0"/><stop offset="1" stop-color="#d99874"/></linearGradient>
  <filter id="s" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="11" stdDeviation="11" flood-color="#16374b" flood-opacity=".25"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
