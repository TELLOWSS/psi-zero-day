<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1dfc7"/><stop offset=".55" stop-color="#d8c6a8"/><stop offset="1" stop-color="#9fb8b6"/></linearGradient>
  <radialGradient id="halo" cx="50%" cy="40%" r="60%"><stop stop-color="#fff8ec" stop-opacity=".9"/><stop offset="1" stop-color="#fff8ec" stop-opacity="0"/></radialGradient>
  <linearGradient id="vest" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0a042"/><stop offset=".58" stop-color="#d26d24"/><stop offset="1" stop-color="#91401d"/></linearGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9b488"/><stop offset="1" stop-color="#c9825b"/></linearGradient>
  <linearGradient id="helmet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb252"/><stop offset=".55" stop-color="#e97827"/><stop offset="1" stop-color="#bd551c"/></linearGradient>
  <filter id="s" x="-30%" y="-30%" width="180%" height="190%"><feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#312a24" flood-opacity=".28"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
