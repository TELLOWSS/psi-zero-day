<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#72c3e8"/><stop offset=".48" stop-color="#d4eef5"/><stop offset="1" stop-color="#f2e4c7"/></linearGradient>
  <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop stop-color="#fff8cc" stop-opacity=".9"/><stop offset="1" stop-color="#fff8cc" stop-opacity="0"/></radialGradient>
  <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d7bb82"/><stop offset="1" stop-color="#a57c49"/></linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#69777b"/><stop offset="1" stop-color="#414c50"/></linearGradient>
  <linearGradient id="slabTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf5"/><stop offset=".6" stop-color="#dfe7e8"/><stop offset="1" stop-color="#c9d5d7"/></linearGradient>
  <linearGradient id="slabFront" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dde7e8"/><stop offset="1" stop-color="#a3b4b7"/></linearGradient>
  <linearGradient id="slabSide" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c3d0d2"/><stop offset="1" stop-color="#8c9fa3"/></linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffbb3c"/><stop offset="1" stop-color="#d56a16"/></linearGradient>
  <linearGradient id="blueSteel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4f8fb1"/><stop offset="1" stop-color="#28556d"/></linearGradient>
  <linearGradient id="exc" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffc84e"/><stop offset="1" stop-color="#db7b18"/></linearGradient>
  <filter id="shadow" x="-35%" y="-35%" width="200%" height="210%"><feDropShadow dx="0" dy="20" stdDeviation="17" flood-color="#143545" flood-opacity=".27"/></filter>
  <filter id="smallShadow" x="-40%" y="-40%" width="220%" height="220%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#17313d" flood-opacity=".28"/></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="15"/></filter>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#35515d" stroke-opacity=".16" stroke-width="2"/></pattern>
</defs>

