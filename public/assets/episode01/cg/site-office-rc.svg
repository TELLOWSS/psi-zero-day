<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="site-office-title site-office-desc">
<title id="site-office-title">PSI ZERO DAY construction scene</title>
<desc id="site-office-desc">Stylized 2.5D construction-site environment for Episode 01.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#50616b"/><stop offset="1" stop-color="#89979b"/></linearGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#454a4a"/><stop offset="1" stop-color="#2a3032"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b9d7e5" stop-opacity=".58"/><stop offset="1" stop-color="#6f8d9b" stop-opacity=".12"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#071017" flood-opacity=".35"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
</defs>
<rect width="1280" height="720" fill="url(#sky)"/>
<circle cx="1090" cy="104" r="54" fill="#ffe2a8" opacity="0.92"/>
<rect y="360" width="1280" height="360" fill="url(#ground)"/>
<rect y="360" width="1280" height="360" fill="url(#grid)"/>

 <g filter="url(#shadow)">
  <rect x="80" y="190" width="1120" height="420" rx="12" fill="#e1ddd1"/>
  <rect x="80" y="190" width="1120" height="48" rx="12" fill="#27343c"/>
  <g fill="#53636b"><rect x="115" y="278" width="246" height="138" rx="5"/><rect x="382" y="278" width="246" height="138" rx="5"/></g>
  <g fill="#f4f0e5"><rect x="140" y="300" width="196" height="92" rx="3"/><rect x="406" y="300" width="196" height="92" rx="3"/></g>
  <rect x="700" y="276" width="430" height="265" rx="8" fill="#b0a997"/>
  <rect x="740" y="316" width="350" height="18" rx="9" fill="#4a5860"/>
  <rect x="740" y="356" width="270" height="12" rx="6" fill="#6c7779"/>
  <rect x="740" y="388" width="312" height="12" rx="6" fill="#6c7779"/>
  <rect x="740" y="420" width="220" height="12" rx="6" fill="#6c7779"/>
  <rect x="280" y="482" width="460" height="28" rx="6" fill="#665443"/>
  <rect x="310" y="510" width="26" height="84" fill="#4b4138"/><rect x="682" y="510" width="26" height="84" fill="#4b4138"/>
 </g>
 
<g opacity=".45"><path d="M0 650C210 610 430 682 640 642s430-4 640-34v112H0Z" fill="#071019"/></g>
<g opacity=".72"><rect x="52" y="48" width="146" height="28" rx="14" fill="#0b141b"/><text x="125" y="67" fill="#f2a64d" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" font-weight="700" letter-spacing="2">NEW PSI</text></g>
</svg>