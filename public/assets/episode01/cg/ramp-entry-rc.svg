  <path d="m1098 468-250-146" stroke="#e6bd68" stroke-width="8" stroke-dasharray="18 16"/>
 </g>
 <g fill="#adb7b8" opacity=".72"><rect x="74" y="248" width="20" height="254"/><rect x="122" y="220" width="20" height="282"/><rect x="1010" y="236" width="20" height="266"/></g>
 <g stroke="#708089" stroke-width="5" opacity=".7"><path d="M84 248h160v12H84z"/><path d="M1020 236h150v12h-150z"/></g>
