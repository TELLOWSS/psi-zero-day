<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Watch · 그래픽 비교 검수</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d1c25;color:#eef3ef;font:15px system-ui}header{padding:18px 24px}h1{font-size:24px;margin:0 0 8px}p{color:#b7cbd0;margin:6px 0}label{display:inline-flex;align-items:center;gap:8px;margin:8px 14px 8px 0}select,input,button{min-height:44px}main{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px 20px}figure{margin:0}figcaption{padding:10px;background:#1b3440}canvas{display:block;width:100%;height:auto;background:#14232c}output{display:block;padding:8px;color:#e4c680}@media(max-width:650px){main{grid-template-columns:1fr}h1{font-size:20px}}</style>
<header><h1>시그널 워치 · 그래픽 비교 검수</h1><p>동일 원화 배치·인물 자세·광원 위치 비교. 게임 진행·해금·저장과 분리된 렌더 검수 화면입니다.</p>
<label>현장<select id="stage"></select></label><label>인물 X<input id="position" type="range" min="140" max="1260" value="760" step="5"></label><label>동작<input id="motion" type="checkbox" checked></label><label>품질<select id="quality"><option>high</option><option>balanced</option><option>low</option></select></label><label>광원<input id="lighting" type="checkbox" checked></label><output id="status">원화 준비 중</output></header>
<main><figure><figcaption>기존 원화 · 스테이지 고정 광원</figcaption><canvas id="before" width="1400" height="900"></canvas></figure><figure><figcaption>개선 원화 · 실제 투광등 위치 반영</figcaption><canvas id="after" width="1400" height="900"></canvas></figure></main>
<script type="module" src="./watch-graphics-review.ts"></script></html>
