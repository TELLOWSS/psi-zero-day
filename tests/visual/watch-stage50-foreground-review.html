<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Watch · 50단계 전경 검수</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d1c25;color:#eef3ef;font:15px system-ui}header{padding:18px 24px}h1{font-size:24px;margin:0 0 8px}p{color:#b7cbd0;margin:6px 0}label{display:inline-flex;align-items:center;gap:8px;margin:8px 14px 8px 0}select,input{min-height:44px}main{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px 20px}figure{margin:0}figcaption{padding:10px;background:#1b3440}canvas{display:block;width:100%;height:auto;background:#14232c}output{display:block;padding:8px;color:#e4c680}@media(max-width:650px){main{grid-template-columns:1fr}h1{font-size:20px}}</style>
<header><h1>시그널 워치 · 50단계 전경 검수</h1><p>실제 등록 원화·알파·조명·인물 보호를 비교합니다. 검수용 인물 배치이며 게임 저장·해금을 바꾸지 않습니다.</p>
<label>작업면<select id="stage"></select></label><label>인물 X<input id="position" type="range" min="30" max="1370" value="670" step="5"></label><label>인물 Y<input id="depth" type="range" min="550" max="895" value="865" step="1"></label><label>걷기<input id="motion" type="checkbox"></label><label>접점 확대<input id="focus" type="checkbox" checked></label><label>인물 보호<input id="protect" type="checkbox" checked></label><label>검수용 경고<input id="warning" type="checkbox"></label><label>품질<select id="quality"><option>high</option><option>balanced</option><option>low</option></select></label><output id="status">원화 준비 중</output></header>
<main><figure><figcaption>원화 · 평면 배경</figcaption><canvas id="before" width="1400" height="900"></canvas></figure><figure><figcaption>실제 등록 전경 · 인물·경고 보호</figcaption><canvas id="after" width="1400" height="900"></canvas></figure></main><script type="module" src="./watch-stage50-foreground-review.ts"></script></html>
